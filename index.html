<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Little Plan ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #ffeef5);
      color: #333;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px 25px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    h1 {
      color: #ff4f81;
      margin-bottom: 15px;
    }

    h2 {
      color: #ff4f81;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }

    button {
      border: none;
      padding: 13px 25px;
      margin: 8px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .yes {
      background: #ff4f81;
      color: white;
    }

    .no {
      background: #eeeeee;
      color: #555;
    }

    .next {
      background: #ff4f81;
      color: white;
      width: 80%;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin: 8px 0 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      background: white;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-top: 8px;
      color: #555;
    }

    .food-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .food-btn {
      margin: 0;
      padding: 15px 8px;
      background: #fff0f5;
      color: #444;
      border: 2px solid #ffd0df;
      border-radius: 15px;
      font-size: 15px;
    }

    .food-btn:hover {
      background: #ff4f81;
      color: white;
      border-color: #ff4f81;
    }

    .heart {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .success {
      font-size: 50px;
      margin-bottom: 10px;
    }

    #finalDetails {
      margin-top: 20px;
      padding: 18px;
      background: #fff0f5;
      border-radius: 15px;
      font-size: 18px;
      line-height: 2;
    }

    .small-text {
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- SCREEN 1 -->
    <div id="screen1">

      <div class="heart">🌸</div>

      <h1>Will you go on a date with me?</h1>

      <p>
        I have a little plan for us... 🥰
      </p>

      <button class="yes" onclick="sayYes()">
        YES ❤️
      </button>

      <button class="no" onclick="sayNo()">
        NO 😢
      </button>

      <p id="noMessage" class="small-text"></p>

    </div>


    <!-- SCREEN 2 -->
    <div id="screen2" class="hidden">

      <div class="heart">
        😭❤️
      </div>

      <h2>
        WAIT... YOU ACTUALLY SAID YES?
      </h2>

      <p>
        Okay okay... let's plan our date! 🥰
      </p>

      <button class="next" onclick="goToDetails()">
        Let's Plan It ❤️
      </button>

    </div>


    <!-- SCREEN 3 -->
    <div id="screen3" class="hidden">

      <h2>
        Let's plan our date 💕
      </h2>

      <label for="name">
        Your Name
      </label>

      <input
        type="text"
        id="name"
        placeholder="Enter your name"
      >

      <label for="date">
        Date
      </label>

      <input
        type="date"
        id="date"
      >

      <label for="time">
        Time
      </label>

      <select id="time">

        <option value="">
          Select a time
        </option>

        <option value="10:00 AM">
          10:00 AM
        </option>

        <option value="12:00 PM">
          12:00 PM
        </option>

        <option value="2:00 PM">
          2:00 PM
        </option>

        <option value="4:00 PM">
          4:00 PM
        </option>

        <option value="6:00 PM">
          6:00 PM
        </option>

        <option value="8:00 PM">
          8:00 PM
        </option>

        <option value="9:00 PM">
          9:00 PM
        </option>

      </select>

      <button class="next" onclick="saveDetails()">
        Continue ❤️
      </button>

      <p id="detailsMessage" class="small-text"></p>

    </div>


    <!-- SCREEN 4 -->
    <div id="screen4" class="hidden">

      <h2>
        What should we eat? 🍴
      </h2>

      <p>
        Pick your favorite ❤️
      </p>

      <div class="food-grid">

        <button
          class="food-btn"
          onclick="chooseFood('Pizza')">
          🍕 Pizza
        </button>

        <button
          class="food-btn"
          onclick="chooseFood('Sushi')">
          🍣 Sushi
        </button>

        <button
          class="food-btn"
          onclick="chooseFood('Burger')">
          🍔 Burger
        </button>

        <button
          class="food-btn"
          onclick="chooseFood('Pasta')">
          🍝 Pasta
        </button>

        <button
          class="food-btn"
          onclick="chooseFood('Tacos')">
          🌮 Tacos
        </button>

        <button
          class="food-btn"
          onclick="chooseFood('Ramen')">
          🍜 Ramen
        </button>

      </div>

      <p id="foodMessage" class="small-text"></p>

    </div>


    <!-- SCREEN 5 -->
    <div id="screen5" class="hidden">

      <div class="success">
        ❤️
      </div>

      <h1>
        IT'S A DATE!
      </h1>

      <p>
        Can't wait! 🥰
      </p>

      <div id="finalDetails"></div>

      <p class="small-text">
        Our Little Plan ❤️
      </p>

    </div>

  </div>


  <script>

    /*
      GOOGLE APPS SCRIPT URL
    */

    var scriptURL =
      "https://script.google.com/macros/s/AKfcyby8zud19ScVWt9pLN4sAjqrBD92UyXvyeAZVt1OMfpjDuJ6pkysPGMDBDKmEBe3U2MLww/exec";


    /*
      VARIABLES
    */

    var selectedName = "";
    var selectedDate = "";
    var selectedTime = "";


    /*
      HIDE ALL SCREENS
    */

    function hideAllScreens() {

      document
        .getElementById("screen1")
        .classList
        .add("hidden");

      document
        .getElementById("screen2")
        .classList
        .add("hidden");

      document
        .getElementById("screen3")
        .classList
        .add("hidden");

      document
        .getElementById("screen4")
        .classList
        .add("hidden");

      document
        .getElementById("screen5")
        .classList
        .add("hidden");
    }


    /*
      YES BUTTON
    */

    function sayYes() {

      hideAllScreens();

      document
        .getElementById("screen2")
        .classList
        .remove("hidden");
    }


    /*
      NO BUTTON
    */

    function sayNo() {

      document
        .getElementById("noMessage")
        .innerHTML =
        "Are you sure? 🥺 Try again ❤️";
    }


    /*
      GO TO DETAILS
    */

    function goToDetails() {

      hideAllScreens();

      document
        .getElementById("screen3")
        .classList
        .remove("hidden");
    }


    /*
      SAVE NAME, DATE AND TIME
    */

    function saveDetails() {

      selectedName =
        document
          .getElementById("name")
          .value
          .trim();

      selectedDate =
        document
          .getElementById("date")
          .value;

      selectedTime =
        document
          .getElementById("time")
          .value;


      if (selectedName === "") {

        document
          .getElementById("detailsMessage")
          .innerHTML =
          "Please enter your name ❤️";

        return;
      }


      if (selectedDate === "") {

        document
          .getElementById("detailsMessage")
          .innerHTML =
          "Please select a date 📅";

        return;
      }


      if (selectedTime === "") {

        document
          .getElementById("detailsMessage")
          .innerHTML =
          "Please select a time ⏰";

        return;
      }


      hideAllScreens();

      document
        .getElementById("screen4")
        .classList
        .remove("hidden");
    }


    /*
      FOOD SELECTION
    */

    function chooseFood(food) {

      var submitURL =
        scriptURL +
        "?personName=" +
        encodeURIComponent(selectedName) +
        "&date=" +
        encodeURIComponent(selectedDate) +
        "&time=" +
        encodeURIComponent(selectedTime) +
        "&food=" +
        encodeURIComponent(food);


      /*
        SEND DATA TO GOOGLE SHEET
      */

      fetch(submitURL, {
        method: "GET",
        mode: "no-cors"
      })
      .catch(function(error) {

        console.log(
          "Submission error:",
          error
        );

      });


      /*
        SHOW FOOD MESSAGE
      */

      document
        .getElementById("foodMessage")
        .innerHTML =
        "Yay! " +
        food +
        " it is! 🥰";


      /*
        SHOW FINAL SCREEN
      */

      setTimeout(function() {

        hideAllScreens();

        document
          .getElementById("screen5")
          .classList
          .remove("hidden");


        document
          .getElementById("finalDetails")
          .innerHTML =
          "❤️ " +
          selectedName +
          "<br>📅 " +
          selectedDate +
          "<br>⏰ " +
          selectedTime +
          "<br>🍴 " +
          food;

      }, 1200);

    }

  </script>

</body>
</html>
